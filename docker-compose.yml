services:
  embedder:
    build:
      context: ./embedder
    expose:
      - "8000"
    volumes:
      - embedder-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  memory:
    build:
      context: ./memory-service
    ports:
      - "8081:8081"
    environment:
      - MEMORY_BEARER_TOKEN=${MEMORY_BEARER_TOKEN}
      - MEMORY_DB_PATH=/data/memory.sqlite
      - EMBEDDER_URL=http://embedder:8000
      - MODEL_URL=${MODEL_URL:-http://host.docker.internal:8080}
      # Container clock for the agent's nowContext + schedule ISO↔epoch + consolidation timing.
      # Single-user deployment is in Cuba; override TZ in .env for a different zone.
      - TZ=${TZ:-America/Havana}
      - IDLE_MS=180000
      - POST_TURN_MS=15000
    volumes:
      - ./docker-data/memory:/data
    depends_on:
      embedder:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # curl (installed in the runtime image); the slim base has no wget, which left the
      # container permanently "unhealthy" despite healthz returning 200.
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  voice:
    build:
      context: ./voice
    ports:
      - "8082:8082"
    environment:
      - VOICE_BEARER_TOKEN=${MEMORY_BEARER_TOKEN}
      - MEMORY_URL=http://memory:8081
      - MEMORY_BEARER_TOKEN=${MEMORY_BEARER_TOKEN}
      # STT: ElevenLabs Scribe (cloud). Forces English so the reply language is pinned.
      - STT_ENGINE=elevenlabs
      - STT_LANGUAGE=en
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_STT_MODEL=scribe_v1
      # faster-whisper vars below are now the inert fallback (only used if STT_ENGINE is unset).
      - WHISPER_MODEL=distil-small.en   # English-only distil model: ~6x faster than small, accurate for EN
      - WHISPER_LANGUAGE=en             # user speaks English → force EN (skips detect, avoids mis-transcription)
      - WHISPER_CPU_THREADS=8           # i3-13100 has 8 threads
      - WHISPER_CACHE=/models
      - HF_HUB_CACHE=/models
      - KOKORO_VOICE=
      - TZ=${TZ:-America/Havana}
    volumes:
      - voice-models:/models
    depends_on:
      memory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  browser:
    build:
      context: ./browser
    ports:
      - "8083:8083"
    environment:
      # Secreto PROPIO del navegador, NO el de la memoria. Dos razones: este
      # servicio conduce un Chromium de verdad dentro de la red del usuario, así
      # que no puede quedarse guardado por el placeholder débil y conocido de
      # MEMORY_BEARER_TOKEN; y el despliegue que ya está en marcha usa su propio
      # token, así que reusar el de la memoria daría 401 en TODAS las herramientas
      # del navegador en cuanto se redesplegara. Define BROWSER_BEARER_TOKEN en el
      # `.env` con una cadena larga y aleatoria (ver `.env.example`).
      - BROWSER_BEARER_TOKEN=${BROWSER_BEARER_TOKEN}
      # Sesión del CLI que sigue el relé del panel.
      # ⚠️ TIENE QUE COINCIDIR con el AGENT_BROWSER_SESSION de la app (valor por
      # omisión `gemma`, en el repositorio `personal_agent`). Si divergen, el
      # navegador sigue funcionando y el panel se queda EN BLANCO, sin un error en
      # ninguna parte. El relé lo compara con la sesión que declara el visor y
      # cierra con un motivo que nombra las dos (ver `SESSION` en browser/relay.py).
      # Se declara aquí con su valor escrito a propósito: una variable que solo
      # existe dentro de un `os.environ.get` es una trampa para el yo del futuro.
      - BROWSER_STREAM_SESSION=gemma
      - TZ=${TZ:-America/Havana}
      # Chrome de Debian; sin esto el CLI busca uno que no existe en la imagen.
      - AGENT_BROWSER_EXECUTABLE_PATH=/usr/bin/chromium
      # AGENT_BROWSER_NO_XVFB queda SIN declarar a propósito: en Linux el CLI usa
      # Xvfb (la imagen lo instala). No añadirla.
      # El demonio se apaga por inactividad; media hora cubre una conversación larga.
      - AGENT_BROWSER_IDLE_TIMEOUT_MS=1800000
      - AGENT_BROWSER_SOCKET_DIR=/run/agent-browser
      # Calidad y tamaño máximo del JPEG del streaming: 1080x608 a calidad 45.
      # Salen de una medición real, no de un valor heredado (el 640x360 q20
      # anterior se veía borroso). Procedencia: repositorio personal_agent,
      # docs/superpowers/notes/2026-11-08-medicion-nitidez-panel.md
      # docker-compose.browser.yml define el mismo servicio y TIENE QUE decir lo
      # mismo: browser/test_compose.py lo comprueba. Si se cambia uno, el otro.
      - AGENT_BROWSER_STREAM_QUALITY=45
      - AGENT_BROWSER_STREAM_MAX_WIDTH=1080
      - AGENT_BROWSER_STREAM_MAX_HEIGHT=608
      # Que no toque la red en cada llamada.
      - AGENT_BROWSER_NO_VERSION_CHECK=1
    # Sin depends_on: el navegador no necesita la memoria.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  embedder-models:
  voice-models:
