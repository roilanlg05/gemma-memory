# Despliegue independiente del servicio del navegador en el i3.
#
# FUENTE DE VERDAD: este fichero, versionado en git. El del i3
# (~/Projects/gemma-browser/docker-compose.yml) se sincroniza desde aquí; no se
# edita a mano allí.
#
# CÓMO DESPLEGARLO: se copia a ~/Projects/gemma-browser/ (junto al directorio
# browser/) con su propio `.env` al lado, creado a partir de browser/.env.example.
# NO se levanta desde la raíz del repositorio: allí ya existe docker-compose.yml
# con otro servicio `browser` en el mismo puerto 8083 (mismo nombre de proyecto,
# choque y huérfanos), y `env_file: .env` se resolvería contra el `.env` del
# servicio de memoria, no contra el del navegador. Sin token falla cerrado (401),
# pero es una trampa silenciosa.
#
# Va aparte del compose de gemma-memory a propósito: el checkout del i3 está en
# `main` con diez ficheros modificados sin commitear, así que cambiarle la rama
# para traer la rama del navegador habría puesto en riesgo ese trabajo local.
# Este directorio es puramente aditivo y no toca nada de lo que ya corre.
#
# Diferencia deliberada respecto al compose de gemma-memory: allí el servicio
# leía `BROWSER_BEARER_TOKEN=${MEMORY_BEARER_TOKEN}`, reusando el token de la
# memoria, que hoy sigue siendo el placeholder débil. Aquí el navegador tiene su
# propio token largo y aleatorio: es un servicio nuevo expuesto en la red de
# Tailscale que puede conducir un Chromium real, y no debe heredar un secreto
# conocido.
services:
  browser:
    build:
      context: ./browser
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      - TZ=America/Havana
      # Sesión del CLI que sigue el relé del panel. TIENE QUE COINCIDIR con el
      # AGENT_BROWSER_SESSION de la app (valor por omisión `gemma`). Si divergen,
      # el navegador sigue funcionando y el panel se queda en blanco; el relé lo
      # compara con la sesión que declara el visor y cierra nombrando las dos.
      # Se escribe con su valor a la vista: una variable que solo existe dentro
      # de un `os.environ.get` es una trampa para el yo del futuro.
      - BROWSER_STREAM_SESSION=gemma
      # Chrome de Debian; sin esto el CLI busca uno que no existe en la imagen.
      - AGENT_BROWSER_EXECUTABLE_PATH=/usr/bin/chromium
      # AGENT_BROWSER_NO_XVFB queda SIN declarar a propósito: en Linux el CLI usa
      # Xvfb (la imagen lo instala). No añadirla.
      # El demonio se apaga por inactividad; media hora cubre una conversación larga.
      - AGENT_BROWSER_IDLE_TIMEOUT_MS=1800000
      - AGENT_BROWSER_SOCKET_DIR=/run/agent-browser
      # Calidad y tamaño máximo del JPEG del streaming: 1080x608 a calidad 45.
      # Salen de una medición real (25 fotogramas por combinación, página de
      # resultados de una tienda), NO de un valor heredado: el 640x360 q20 anterior
      # se veía borroso. Ver, en el repositorio personal_agent (commit 03ba854),
      # docs/superpowers/notes/2026-11-08-medicion-nitidez-panel.md
      # Fotograma medio 51 594 B, máximo 54 715 B. Con el tope de 7 fps de
      # browser/relay.py el pico es 383 kB/s, bajo el presupuesto de 400 kB/s.
      # Si se cambian, hay que volver a medir y actualizar test_compose.py Y
      # browser/test_app.py. El 54 715 de test_el_caudal_del_panel_cabe_en_un_enlace_movil
      # es una MEDICIÓN (máximo de 25 fotogramas a 1080x608 q45), no una constante
      # de diseño: con otra resolución o calidad ese número deja de ser cierto y la
      # prueba seguiría en verde con un dato falso. No se actualiza a ojo: se mide
      # de nuevo con el método de la nota citada arriba.
      - AGENT_BROWSER_STREAM_QUALITY=45
      - AGENT_BROWSER_STREAM_MAX_WIDTH=1080
      - AGENT_BROWSER_STREAM_MAX_HEIGHT=608
      # Que no toque la red en cada llamada.
      - AGENT_BROWSER_NO_VERSION_CHECK=1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
